<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2070" viewBox="0 0 2600 2070"><rect width="100%" height="100%" fill="white"/><text x="92" y="90.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#173456" font-weight="bold">DIAGRAMA DE CONTEXTO DEL SISTEMA</text><text x="92" y="155.625" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#232C38">Plataforma web para la búsqueda y contratación de servicios de construcción civil en Ayacucho</text><ellipse cx="450.0" cy="260.0" rx="40.0" ry="40.0" fill="#17324D" stroke="#17324D"/><text x="450.0" y="265.525" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#FFFFFF"></text><rect x="250" y="310" width="400" height="175" rx="10" fill="#17324D" stroke="#17324D"/><text x="406.03125" y="352.375" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">CLIENTE</text><text x="397.859375" y="378.025" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">[Persona]</text><text x="306.375" y="403.67499999999995" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">Solicita servicios, compara</text><text x="386.109375" y="429.32499999999993" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">propuestas,</text><text x="282.40625" y="454.9749999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">contrata y realiza seguimiento.</text><ellipse cx="1300.0" cy="260.0" rx="40.0" ry="40.0" fill="#17324D" stroke="#17324D"/><text x="1300.0" y="265.525" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#FFFFFF"></text><rect x="1100" y="310" width="400" height="175" rx="10" fill="#17324D" stroke="#17324D"/><text x="1236.0234375" y="365.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">PRESTADOR</text><text x="1247.859375" y="390.84999999999997" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">[Persona]</text><text x="1113.515625" y="416.49999999999994" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">Trabajador, profesional o empresa.</text><text x="1119.234375" y="442.1499999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">Ofrece, cotiza y ejecuta servicios.</text><ellipse cx="2150.0" cy="260.0" rx="40.0" ry="40.0" fill="#17324D" stroke="#17324D"/><text x="2150.0" y="265.525" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#FFFFFF"></text><rect x="1950" y="310" width="400" height="175" rx="10" fill="#17324D" stroke="#17324D"/><text x="2059.0390625" y="365.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">ADMINISTRADOR</text><text x="2097.859375" y="390.84999999999997" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">[Persona]</text><text x="1970.3671875" y="416.49999999999994" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">Gestiona usuarios, revisa perfiles</text><text x="1974.203125" y="442.1499999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">y atiende reportes e incidencias.</text><rect x="800" y="700" width="1000" height="300" rx="10" fill="#D9EDFC" stroke="#00649B"/><text x="1300.0" y="855.525" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#123247"></text><text x="1064.171875" y="760.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#123247" font-weight="bold">PLATAFORMA DE SERVICIOS</text><text x="1089.5546875" y="801.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#123247" font-weight="bold">DE CONSTRUCCIÓN CIVIL</text><text x="1109.015625" y="850.15" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#123247">[Sistema de software · en alcance]</text><text x="991.3046875" y="913.925" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#123247">Conecta clientes con prestadores y permite gestionar</text><text x="1024.671875" y="944.9749999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#123247">la búsqueda, cotización, contratación, acuerdos</text><text x="1126.296875" y="976.0249999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#123247">y seguimiento de los trabajos.</text><rect x="175" y="535" width="550" height="96" rx="10" fill="#FFFFFF" stroke="#FFFFFF"/><text x="199.1640625" y="575.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">Busca prestadores, solicita y contrata servicios;</text><text x="252.515625" y="604.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">consulta avances y califica el trabajo.</text><rect x="1010" y="535" width="580" height="96" rx="10" fill="#FFFFFF" stroke="#FFFFFF"/><text x="1111.8203125" y="575.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">Gestiona su perfil y sus propuestas;</text><text x="1068.953125" y="604.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">confirma contrataciones y registra avances.</text><rect x="1875" y="535" width="550" height="96" rx="10" fill="#FFFFFF" stroke="#FFFFFF"/><text x="1944.40625" y="575.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">Administra el catálogo, verifica perfiles</text><text x="1972.875" y="604.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">y gestiona reportes e incidencias.</text><rect x="100" y="1330" width="540" height="225" rx="10" fill="#E9EDF2" stroke="#56616F"/><text x="370.0" y="1448.025" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#232C38"></text><text x="123.34375" y="1386.475" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38" font-weight="bold">SERVICIO DE INTERPRETACIÓN CON IA</text><text x="284.84375" y="1433.675" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#232C38">[Sistema externo]</text><text x="190.0234375" y="1490.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">Interpreta la necesidad expresada</text><text x="149.453125" y="1519.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">y sugiere criterios de búsqueda editables.</text><text x="912" y="1000.325" font-family="DejaVu Sans,Arial,sans-serif" font-size="1" fill="#232C38"></text><rect x="105" y="1140" width="530" height="88" rx="10" fill="#FFFFFF" stroke="#FFFFFF"/><text x="241.8203125" y="1176.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">Solicita la interpretación</text><text x="284.015625" y="1205.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">de la necesidad.</text><rect x="720" y="1330" width="540" height="225" rx="10" fill="#E9EDF2" stroke="#56616F"/><text x="990.0" y="1448.025" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#232C38"></text><text x="794.671875" y="1386.475" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38" font-weight="bold">SERVICIO DE NOTIFICACIONES</text><text x="904.84375" y="1433.675" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#232C38">[Sistema externo]</text><text x="792.4609375" y="1490.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">Envía avisos a clientes y prestadores.</text><text x="835.625" y="1519.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">Proveedor y canal por definir.</text><text x="1177" y="1000.325" font-family="DejaVu Sans,Arial,sans-serif" font-size="1" fill="#232C38"></text><rect x="725" y="1210" width="530" height="88" rx="10" fill="#FFFFFF" stroke="#FFFFFF"/><text x="854.4140625" y="1246.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">Solicita el envío de avisos</text><text x="807.59375" y="1275.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">sobre solicitudes y contrataciones.</text><rect x="1340" y="1330" width="540" height="225" rx="10" fill="#E9EDF2" stroke="#56616F"/><text x="1610.0" y="1448.025" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#232C38"></text><text x="1390.8671875" y="1386.475" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38" font-weight="bold">SERVICIO DE MAPAS Y UBICACIÓN</text><text x="1475.765625" y="1433.675" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#232C38">[Sistema externo · opcional]</text><text x="1423.625" y="1490.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">Apoya la ubicación de los servicios.</text><text x="1405.8828125" y="1519.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">Alternativa: selección manual de zona.</text><text x="1447" y="1000.325" font-family="DejaVu Sans,Arial,sans-serif" font-size="1" fill="#232C38"></text><rect x="1345" y="1210" width="530" height="88" rx="10" fill="#FFFFFF" stroke="#FFFFFF"/><text x="1498.5234375" y="1246.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">Consulta ubicaciones</text><text x="1474.015625" y="1275.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">y referencias geográficas.</text><rect x="1960" y="1330" width="540" height="225" rx="10" fill="#FFE4D3" stroke="#9C4316" stroke-dasharray="7 5"/><polyline points="1960,1330 2500,1330 2500,1555 1960,1555 1960,1330" fill="none" stroke="#9C4316" stroke-width="2" stroke-dasharray="7 5"/><text x="2230.0" y="1448.025" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#512407"></text><text x="2094.4375" y="1386.475" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#512407" font-weight="bold">PASARELA DE PAGOS</text><text x="2096.5234375" y="1433.675" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#512407">[Sistema externo · FUTURO]</text><text x="2022.5546875" y="1490.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#512407">Procesará cobros por planes o servicios</text><text x="2039.5703125" y="1519.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#512407">de la plataforma. No implementada.</text><text x="1712" y="1000.325" font-family="DejaVu Sans,Arial,sans-serif" font-size="1" fill="#232C38"></text><rect x="1965" y="1140" width="530" height="88" rx="10" fill="#FFFFFF" stroke="#FFFFFF"/><text x="2074.828125" y="1176.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">Solicitará y consultará cobros</text><text x="2070.0" y="1205.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#26364A">por servicios de la plataforma.</text><rect x="80" y="1650" width="1170" height="285" rx="0" fill="#E9EDF2" stroke="#56616F"/><text x="92" y="1679" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#232C38"></text><text x="122" y="1698.125" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#173456" font-weight="bold">LEYENDA</text><rect x="115" y="1735" width="72" height="28" rx="10" fill="#17324D" stroke="#17324D"/><text x="151.0" y="1754.525" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#FFFFFF"></text><text x="222" y="1755.825" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">Persona que utiliza la plataforma</text><rect x="115" y="1780" width="72" height="28" rx="10" fill="#D9EDFC" stroke="#00649B"/><text x="151.0" y="1799.525" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#123247"></text><text x="222" y="1800.825" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">Sistema de software en alcance</text><rect x="115" y="1825" width="72" height="28" rx="10" fill="#E9EDF2" stroke="#56616F"/><text x="151.0" y="1844.525" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#232C38"></text><text x="222" y="1845.825" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">Sistema externo de terceros</text><rect x="115" y="1870" width="72" height="28" rx="10" fill="#FFE4D3" stroke="#9C4316" stroke-dasharray="7 5"/><polyline points="115,1870 187,1870 187,1898 115,1898 115,1870" fill="none" stroke="#9C4316" stroke-width="2" stroke-dasharray="7 5"/><text x="151.0" y="1889.525" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#512407"></text><text x="222" y="1890.825" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">Integración futura · fuera de la versión actual</text><rect x="1300" y="1650" width="1220" height="285" rx="0" fill="#E9EDF2" stroke="#56616F"/><text x="1312" y="1679" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#232C38"></text><text x="1342" y="1698.125" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#173456" font-weight="bold">ALCANCE Y LECTURA</text><text x="1342" y="1767.625" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">• Flecha continua: relación prevista en el alcance actual.</text><text x="1342" y="1795.975" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">• Flecha discontinua naranja: integración futura.</text><text x="1342" y="1824.3249999999998" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">• La flecha indica quién inicia la interacción; no es una secuencia.</text><text x="1342" y="1852.6749999999997" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">• Las respuestas se omiten para mantener la lectura del contexto.</text><text x="1342" y="1881.0249999999996" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">• Los módulos, contenedores y datos se detallan en otros niveles.</text><text x="97" y="1988.475" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#173456" font-weight="bold">PAGOS DE LOS TRABAJOS: el cliente paga directamente al prestador. La pasarela futura corresponde a los servicios de la plataforma.</text><text x="97" y="2034.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#232C38">Búsqueda: solo se muestran prestadores registrados. Los criterios sugeridos se pueden corregir y también existen filtros tradicionales.</text><polyline points="450.0,485 450,850 800,850.0" fill="none" stroke="#17324D" stroke-width="3"/><polygon points="800,850.0 783.0,857.0 783.0,843.0" fill="#17324D" stroke="#17324D"/><polyline points="1300.0,485 1300.0,700" fill="none" stroke="#17324D" stroke-width="3"/><polygon points="1300.0,700 1293.0,683.0 1307.0,683.0" fill="#17324D" stroke="#17324D"/><polyline points="2150.0,485 2150,850 1800,850.0" fill="none" stroke="#17324D" stroke-width="3"/><polygon points="1800,850.0 1817.0,843.0 1817.0,857.0" fill="#17324D" stroke="#17324D"/><polyline points="900.0,1000 900,1100 370,1100 370.0,1330" fill="none" stroke="#56616F" stroke-width="3"/><polygon points="370.0,1330 363.0,1313.0 377.0,1313.0" fill="#56616F" stroke="#56616F"/><polyline points="1165.0,1000 1165,1190 990,1190 990.0,1330" fill="none" stroke="#56616F" stroke-width="3"/><polygon points="990.0,1330 983.0,1313.0 997.0,1313.0" fill="#56616F" stroke="#56616F"/><polyline points="1435.0,1000 1435,1190 1610,1190 1610.0,1330" fill="none" stroke="#56616F" stroke-width="3"/><polygon points="1610.0,1330 1603.0,1313.0 1617.0,1313.0" fill="#56616F" stroke="#56616F"/><polyline points="1700.0,1000 1700,1100 2230,1100 2230.0,1330" fill="none" stroke="#9C4316" stroke-width="3" stroke-dasharray="7 5"/><polygon points="2230.0,1330 2223.0,1313.0 2237.0,1313.0" fill="#9C4316" stroke="#9C4316"/><rect x="175" y="535" width="550" height="96" fill="white"/><text x="199.1640625" y="575.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">Busca prestadores, solicita y contrata servicios;</text><text x="252.515625" y="604.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">consulta avances y califica el trabajo.</text><rect x="1010" y="535" width="580" height="96" fill="white"/><text x="1111.8203125" y="575.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">Gestiona su perfil y sus propuestas;</text><text x="1068.953125" y="604.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">confirma contrataciones y registra avances.</text><rect x="1875" y="535" width="550" height="96" fill="white"/><text x="1944.40625" y="575.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">Administra el catálogo, verifica perfiles</text><text x="1972.875" y="604.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">y gestiona reportes e incidencias.</text><rect x="105" y="1140" width="530" height="88" fill="white"/><text x="241.8203125" y="1176.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">Solicita la interpretación</text><text x="284.015625" y="1205.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">de la necesidad.</text><rect x="725" y="1210" width="530" height="88" fill="white"/><text x="854.4140625" y="1246.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">Solicita el envío de avisos</text><text x="807.59375" y="1275.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">sobre solicitudes y contrataciones.</text><rect x="1345" y="1210" width="530" height="88" fill="white"/><text x="1498.5234375" y="1246.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">Consulta ubicaciones</text><text x="1474.015625" y="1275.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">y referencias geográficas.</text><rect x="1965" y="1140" width="530" height="88" fill="white"/><text x="2074.828125" y="1176.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">Solicitará y consultará cobros</text><text x="2070.0" y="1205.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#344357">por servicios de la plataforma.</text></svg>