<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1820" viewBox="0 0 2500 1820"><rect width="100%" height="100%" fill="white"/><text x="67" y="74.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="#173456" font-weight="bold">CAPAS DEL MÓDULO Y REGLA DE DEPENDENCIA</text><text x="67" y="140.3" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#232C38">Diseño interno · Contrataciones y acuerdos · plataforma de servicios de construcción civil en Ayacucho</text><rect x="55" y="190" width="2370" height="105" rx="10" fill="#17324D" stroke="#17324D"/><text x="975.265625" y="234.45" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#FFFFFF" font-weight="bold">MÓDULO DEL BACKEND · contrataciones/</text><text x="531.4375" y="265.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#FFFFFF" font-weight="bold">Clean Architecture dentro del monolito modular · organización lógica propuesta, sin framework seleccionado</text><rect x="25" y="375" width="2425" height="1050" rx="0" fill="#FFFFFF" stroke="#C7D1DC" stroke-dasharray="7 5"/><polyline points="25,375 2450,375 2450,1425 25,1425 25,375" fill="none" stroke="#C7D1DC" stroke-width="2" stroke-dasharray="7 5"/><text x="37" y="404" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#26364A"></text><rect x="60" y="450" width="480" height="660" rx="0" fill="#D9EDFC" stroke="#00649B"/><text x="72" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#123247"></text><rect x="60" y="400" width="260" height="50" rx="0" fill="#D9EDFC" stroke="#00649B"/><text x="72" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#123247" font-weight="bold">presentacion/</text><rect x="660" y="450" width="540" height="660" rx="0" fill="#DCEFEB" stroke="#397B75"/><text x="672" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#183D36"></text><rect x="660" y="400" width="260" height="50" rx="0" fill="#DCEFEB" stroke="#397B75"/><text x="672" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#183D36" font-weight="bold">aplicacion/</text><rect x="1320" y="450" width="480" height="660" rx="0" fill="#FFF0C2" stroke="#806000"/><text x="1332" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#302500"></text><rect x="1320" y="400" width="260" height="50" rx="0" fill="#FFF0C2" stroke="#806000"/><text x="1332" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#302500" font-weight="bold">dominio/</text><rect x="1940" y="450" width="480" height="660" rx="0" fill="#E6D9F5" stroke="#69458F"/><text x="1952" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#38234D"></text><rect x="1940" y="400" width="325" height="50" rx="0" fill="#E6D9F5" stroke="#69458F"/><text x="1952" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#38234D" font-weight="bold">infraestructura/</text><text x="97" y="505.625" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#232C38" font-weight="bold">PRESENTACIÓN</text><text x="97" y="619.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38">«controlador»</text><text x="97" y="650.25" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38">ContratacionController</text><text x="97" y="681.3" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38"></text><text x="97" y="712.3499999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38">«rutas HTTP»</text><text x="97" y="743.3999999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38">RutasContrataciones</text><text x="97" y="774.4499999999998" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38"></text><text x="97" y="805.4999999999998" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38">Recibe la petición, toma la identidad</text><text x="97" y="836.5499999999997" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38">del usuario autenticado, valida el</text><text x="97" y="867.5999999999997" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38">formato e invoca el caso de uso.</text><text x="97" y="898.6499999999996" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38"></text><text x="97" y="929.6999999999996" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38">Convierte el resultado o error</text><text x="97" y="960.7499999999995" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38">en una respuesta HTTP.</text><text x="697" y="505.625" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#232C38" font-weight="bold">APLICACIÓN</text><text x="697" y="624.0999999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">«casos de uso»</text><text x="697" y="653.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">AceptarPropuesta</text><text x="697" y="683.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">ConfirmarContratacion</text><text x="697" y="713.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">ProponerCambioDeCondiciones</text><text x="697" y="742.9000000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38"></text><text x="697" y="772.6000000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">«entradas y resultados»</text><text x="697" y="802.3000000000002" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">Datos de la operación y sus resultados</text><text x="697" y="832.0000000000002" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38"></text><text x="697" y="861.7000000000003" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">«puertos de salida»</text><text x="697" y="891.4000000000003" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">RepositorioContrataciones</text><text x="697" y="921.1000000000004" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">UnidadDeTrabajo · AvisosPendientes</text><text x="697" y="950.8000000000004" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">ConsultaPropuestas · GestionSolicitudes</text><text x="697" y="980.5000000000005" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38"></text><text x="697" y="1010.2000000000005" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">Coordina permisos, reglas y guardado.</text><text x="1357" y="505.625" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#232C38" font-weight="bold">DOMINIO</text><text x="1357" y="636.45" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">«entidad»</text><text x="1357" y="666.1500000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">Contratacion</text><text x="1357" y="695.8500000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38"></text><text x="1357" y="725.5500000000002" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">«objetos de valor»</text><text x="1357" y="755.2500000000002" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">CondicionesAcordadas</text><text x="1357" y="784.9500000000003" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">VersionDeAcuerdo</text><text x="1357" y="814.6500000000003" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38"></text><text x="1357" y="844.3500000000004" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">«estados y reglas»</text><text x="1357" y="874.0500000000004" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">EstadoContratacion</text><text x="1357" y="903.7500000000005" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">Confirmación de las condiciones</text><text x="1357" y="933.4500000000005" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">Aceptación bilateral de cambios</text><text x="1357" y="963.1500000000005" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38"></text><text x="1357" y="992.8500000000006" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">Sin HTTP, ORM, SDK ni drivers.</text><text x="1977" y="505.3" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#232C38" font-weight="bold">INFRAESTRUCTURA</text><text x="1977" y="636.45" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">«persistencia»</text><text x="1977" y="666.1500000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">RepositorioContratacionesBD</text><text x="1977" y="695.8500000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">UnidadDeTrabajoBD</text><text x="1977" y="725.5500000000002" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38"></text><text x="1977" y="755.2500000000002" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">«avisos pendientes»</text><text x="1977" y="784.9500000000003" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">RegistroDeAvisosBD</text><text x="1977" y="814.6500000000003" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38"></text><text x="1977" y="844.3500000000004" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">«adaptadores entre módulos»</text><text x="1977" y="874.0500000000004" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">ConsultaPropuestasAdapter</text><text x="1977" y="903.7500000000005" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">GestionSolicitudesAdapter</text><text x="1977" y="933.4500000000005" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38"></text><text x="1977" y="963.1500000000005" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">Implementan los puertos internos.</text><text x="1977" y="992.8500000000006" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#232C38">Usan APIs públicas de otros módulos.</text><rect x="60" y="1280" width="2360" height="115" rx="10" fill="#E9EDF2" stroke="#56616F"/><text x="922.2890625" y="1313.925" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38" font-weight="bold">RAÍZ DE COMPOSICIÓN · configuracionDelModulo</text><text x="640.3125" y="1344.975" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38" font-weight="bold">Crea los adaptadores, los inyecta en los casos de uso y conecta el controlador con las rutas.</text><text x="616.328125" y="1376.0249999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#232C38" font-weight="bold">Es el punto de ensamblaje que conoce las implementaciones concretas y las capas que conecta.</text><text x="112" y="1244.325" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38" font-weight="bold">«crea, conecta e inyecta»</text><rect x="55" y="1470" width="1120" height="245" rx="0" fill="#FFFFFF" stroke="#C7D1DC"/><text x="67" y="1506" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#26364A" font-weight="bold">LEYENDA</text><rect x="85" y="1550" width="1" height="1" rx="10" fill="#FFFFFF" stroke="#C7D1DC"/><text x="85.5" y="1556.025" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#26364A"></text><rect x="220" y="1550" width="1" height="1" rx="10" fill="#FFFFFF" stroke="#C7D1DC"/><text x="220.5" y="1556.025" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#26364A"></text><text x="262" y="1557.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#232C38">Dependencia de código: importa tipos o contratos.</text><rect x="85" y="1610" width="1" height="1" rx="10" fill="#FFFFFF" stroke="#C7D1DC"/><text x="85.5" y="1616.025" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#26364A"></text><rect x="220" y="1610" width="1" height="1" rx="10" fill="#FFFFFF" stroke="#C7D1DC"/><text x="220.5" y="1616.025" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#26364A"></text><text x="262" y="1617.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#232C38">Realización: implementa una interfaz interna.</text><rect x="85" y="1670" width="1" height="1" rx="10" fill="#FFFFFF" stroke="#C7D1DC"/><text x="85.5" y="1676.025" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#26364A"></text><rect x="220" y="1670" width="1" height="1" rx="10" fill="#FFFFFF" stroke="#C7D1DC"/><text x="220.5" y="1676.025" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#26364A"></text><text x="262" y="1677.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#232C38">Composición: crea y conecta las piezas del módulo.</text><rect x="1225" y="1470" width="1200" height="245" rx="0" fill="#FFFFFF" stroke="#C7D1DC"/><text x="1237" y="1506" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#26364A" font-weight="bold">REGLAS QUE DEBE RESPETAR EL CÓDIGO</text><text x="1267" y="1560.125" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">1. El dominio no importa código de las capas externas.</text><text x="1267" y="1588.475" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">2. La aplicación usa el dominio y declara sus puertos de salida.</text><text x="1267" y="1616.8249999999998" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">3. La infraestructura implementa esos puertos y usa tipos del dominio.</text><text x="1267" y="1645.1749999999997" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">4. La presentación invoca casos de uso; no consulta la base de datos.</text><text x="1267" y="1673.5249999999996" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#232C38">5. Solo se accede a otros módulos mediante sus operaciones públicas.</text><text x="67" y="1784.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#232C38">LECTURA: las flechas expresan dependencias y ensamblaje, no el orden de ejecución. Los nombres representan piezas propuestas, no código implementado. La pasarela de pagos no interviene en la contratación actual.</text><polyline points="540,780.0 660,780.0" fill="none" stroke="#263D5B" stroke-width="3" stroke-dasharray="7 5"/><polygon points="660,780.0 646.0,785.0 646.0,775.0" fill="#263D5B" stroke="#263D5B"/><rect x="562" y="748" width="72.78125" height="19" fill="white"/><text x="565" y="763" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#263D5B">«importa»</text><polyline points="1200,780.0 1320,780.0" fill="none" stroke="#263D5B" stroke-width="3" stroke-dasharray="7 5"/><polygon points="1320,780.0 1306.0,785.0 1306.0,775.0" fill="#263D5B" stroke="#263D5B"/><rect x="1222" y="748" width="72.78125" height="19" fill="white"/><text x="1225" y="763" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#263D5B">«importa»</text><polyline points="1940,780.0 1800,780.0" fill="none" stroke="#263D5B" stroke-width="3" stroke-dasharray="7 5"/><polygon points="1800,780.0 1814.0,775.0 1814.0,785.0" fill="#263D5B" stroke="#263D5B"/><rect x="1822" y="748" width="72.78125" height="19" fill="white"/><text x="1825" y="763" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#263D5B">«importa»</text><polyline points="2102.5,400 2102.5,330 790,330 790.0,400" fill="none" stroke="#69458F" stroke-width="3" stroke-dasharray="7 5"/><polygon points="790.0,400 785.0,386.0 795.0,386.0" fill="white" stroke="#69458F"/><rect x="1237" y="308" width="243.734375" height="19" fill="white"/><text x="1240" y="323" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#69458F">«implementa puertos de aplicación»</text><polyline points="1240.0,1280 1240,1200 300.0,1200 300.0,1110" fill="none" stroke="#397B75" stroke-width="3"/><polygon points="300.0,1110 305.0,1124.0 295.0,1124.0" fill="#397B75" stroke="#397B75"/><polyline points="1240.0,1280 1240,1200 930.0,1200 930.0,1110" fill="none" stroke="#397B75" stroke-width="3"/><polygon points="930.0,1110 935.0,1124.0 925.0,1124.0" fill="#397B75" stroke="#397B75"/><polyline points="1240.0,1280 1240,1200 2180.0,1200 2180.0,1110" fill="none" stroke="#397B75" stroke-width="3"/><polygon points="2180.0,1110 2185.0,1124.0 2175.0,1124.0" fill="#397B75" stroke="#397B75"/><polyline points="86,1550.5 220,1550.5" fill="none" stroke="#263D5B" stroke-width="3" stroke-dasharray="7 5"/><polygon points="220,1550.5 206.0,1555.5 206.0,1545.5" fill="#263D5B" stroke="#263D5B"/><polyline points="86,1610.5 220,1610.5" fill="none" stroke="#69458F" stroke-width="3" stroke-dasharray="7 5"/><polygon points="220,1610.5 206.0,1615.5 206.0,1605.5" fill="white" stroke="#69458F"/><polyline points="86,1670.5 220,1670.5" fill="none" stroke="#397B75" stroke-width="3"/><polygon points="220,1670.5 206.0,1675.5 206.0,1665.5" fill="#397B75" stroke="#397B75"/></svg>